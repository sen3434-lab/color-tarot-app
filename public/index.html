<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OZ 컬러타로 · 리딩</title>
<link rel="stylesheet" href="/css/style.css"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#bc6338"/>
<link rel="icon" href="/icons/icon-192.png"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<style>
  .hero { position: relative; text-align: center; padding: 18px 0 6px; }
  .hero-aura {
    position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
    width: 320px; height: 220px; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 20% 35%, rgba(200,32,42,.20), transparent 55%),
      radial-gradient(circle at 75% 30%, rgba(230,168,0,.20), transparent 55%),
      radial-gradient(circle at 50% 70%, rgba(143,63,190,.18), transparent 55%),
      radial-gradient(circle at 80% 75%, rgba(33,89,168,.16), transparent 55%),
      radial-gradient(circle at 25% 75%, rgba(46,139,87,.16), transparent 55%);
    filter: blur(26px);
  }
  .hero-eyebrow { position: relative; font-size: 10.5px; letter-spacing: 5px; color: var(--primary); font-weight: 600; text-transform: uppercase; }
  .hero h1 { position: relative; font-size: 22px; line-height: 1.5; margin-top: 10px; }
  .hero p { position: relative; color: var(--muted-foreground); font-size: 13px; margin-top: 10px; line-height: 1.6; }
  .hero-dots { position: relative; display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
  .hero-dots .d { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 2px 6px rgba(40,30,20,.15); }
  #moodForm textarea { min-height: 74px; resize: vertical; }
  .draw-btn-wrap { display: flex; justify-content: center; margin-top: 22px; }
  .chip-intro { text-align: center; font-size: 12px; color: var(--muted-foreground); margin: 22px 0 4px; }

  .limit-box { text-align: center; padding: 40px 20px; }
  .limit-box .ic { font-size: 34px; margin-bottom: 12px; }

  #resultView { display: none; }
  .card-frame {
    width: 220px; margin: 0 auto;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(40,30,20,.12);
    border: 0.8px solid var(--border);
    background: var(--card);
  }
  .card-frame img { width: 100%; display: block; aspect-ratio: 3/4.4; object-fit: cover; background: var(--muted); }
  .card-name { text-align: center; margin-top: 14px; font-size: 19px; }
  .card-keyword { text-align: center; color: var(--primary-dark); font-size: 13px; margin-top: 4px; font-weight: 500; }

  .quote-box { background: var(--secondary); border-radius: 14px; padding: 16px 18px; margin: 22px 0; text-align: center; font-size: 13.5px; color: var(--foreground); }
  .quote-box .q-label { font-size: 10.5px; letter-spacing: 2px; color: var(--muted-foreground); text-transform: uppercase; margin-bottom: 6px; }

  .reading-box p { font-size: 14.5px; line-height: 1.9; color: var(--foreground); white-space: pre-wrap; }

  .rx-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 14px; }
  .rx-card { border: 0.8px solid var(--border); border-radius: 14px; padding: 16px 18px; }
  .rx-card .rx-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .rx-card .rx-head .ic { font-size: 17px; }
  .rx-card .rx-name { font-weight: 600; margin-bottom: 4px; font-size: 13.5px; }
  .rx-card p.rx-reason { font-size: 13.5px; color: var(--foreground); line-height: 1.75; }

  .closing-box { text-align: center; margin: 26px 0 6px; padding: 0 8px; font-size: 13px; color: var(--primary-dark); font-style: italic; line-height: 1.7; }

  .ai-loading { text-align: center; padding: 20px 0; }
  .ai-loading p { font-size: 12.5px; color: var(--muted-foreground); margin-top: 10px; }

  .upsell-box { text-align: center; padding: 22px; background: var(--secondary); border-radius: 16px; margin-top: 16px; }
  .upsell-box .ic { font-size: 22px; margin-bottom: 10px; letter-spacing: 4px; }
  .upsell-box p { font-size: 13.5px; line-height: 1.6; }

  .gate-box { text-align: center; padding: 26px 20px; background: var(--secondary); border-radius: 16px; margin: 20px 0; }
  .gate-box .gate-ic { font-size: 28px; margin-bottom: 8px; }
  .result-actions { display: flex; gap: 10px; margin-top: 26px; }
  .result-actions .btn { flex: 1; }
</style>
</head>
<body>

<div class="topbar">
  <a href="/index.html" class="brand">OZ <span>✦</span> 컬러타로</a>
  <div class="topbar-actions">
    <a href="/coins.html" class="badge badge-free" id="coinBadge">🪙</a>
    <a href="/settings.html" class="icon-btn">계정</a>
  </div>
</div>

<div class="container">

  <div id="moodView">
    <div class="hero">
      <div class="hero-aura"></div>
      <div class="hero-eyebrow">Color Healing</div>
      <h1 id="heroTitle">오늘, 어떤 마음이신가요?</h1>
      <p>color 한 장이 당신의 마음을 가만히 안아드릴게요.<br/>편하게 이야기해주세요.</p>
      <div class="hero-dots">
        <div class="d" style="background:#c8202a;"></div>
        <div class="d" style="background:#e6a800;"></div>
        <div class="d" style="background:#2e8b57;"></div>
        <div class="d" style="background:#2159a8;"></div>
        <div class="d" style="background:#8f3fbe;"></div>
      </div>
    </div>

    <div class="chip-intro">지금 마음에 가까운 것이 있다면 골라보세요</div>
    <form id="moodForm">
      <div class="chip-grid" id="chipGrid"></div>
      <div class="field">
        <textarea id="moodText" placeholder="지금 느끼는 감정을 편하게 적어보세요..."></textarea>
      </div>
      <div class="draw-btn-wrap">
        <button type="submit" class="btn btn-primary" id="drawBtn">🔮 마음을 색으로 만나보기</button>
      </div>
    </form>
  </div>

  <div id="loadingView" style="display:none;">
    <div class="center" style="padding:70px 0;">
      <div class="spinner"></div>
      <p class="muted small mt-16">색이 카드를 들여다보고 있어요...</p>
    </div>
  </div>

  <div id="resultView">
    <a href="#" id="backBtn" class="small muted">← 다시 고르기</a>

    <div class="card-frame mt-24" id="cardFrame">
      <img id="cardImg" alt=""/>
    </div>
    <div class="card-name" id="cardName"></div>

    <div class="quote-box">
      <div class="q-label">당신의 마음</div>
      <div id="userMood"></div>
    </div>

    <div id="readingGate" class="gate-box" style="display:none;"></div>

    <div id="aiLoading" class="ai-loading" style="display:none;"></div>

    <div id="aiContent" style="display:none;">
      <div class="section-label">오늘의 리딩</div>
      <div class="card reading-box">
        <p id="readingText"></p>
      </div>

      <div id="memberOnlyContent">
        <div class="rx-grid">
          <div class="rx-card">
            <div class="rx-head"><span class="ic">🌿</span> <span>센트 처방</span></div>
            <p class="rx-name" id="aromaName"></p>
            <p class="rx-reason" id="aromaReason"></p>
          </div>
          <div class="rx-card">
            <div class="rx-head"><span class="ic">🍵</span> <span>티 처방</span></div>
            <p class="rx-name" id="teaName"></p>
            <p class="rx-reason" id="teaReason"></p>
          </div>
          <div class="rx-card">
            <div class="rx-head"><span class="ic">💎</span> <span>원석 처방</span></div>
            <p class="rx-name" id="gemName"></p>
            <p class="rx-reason" id="gemReason"></p>
          </div>
        </div>

        <div class="closing-box" id="closingText"></div>
      </div>

      <p class="small muted center mt-16" id="savedNote"></p>
    </div>

    <details class="accordion" id="studentBox" style="display:none;">
      <summary>🎓 수강생을 위한 실무 상담 팁</summary>
      <div class="accordion-body">
        <p><b id="studentQuestion"></b></p>
        <p class="mt-8" id="studentPhrase"></p>
      </div>
    </details>

    <div class="result-actions" id="resultActions">
      <a class="btn btn-outline" href="/history.html">내 기록 보기</a>
      <button class="btn btn-primary" id="redrawBtn">새 카드 뽑기</button>
    </div>
  </div>

</div>

<script type="module">
import { getSb, getSession, getMember, showToast, renderBottomNav, claimFreeCoins, getBalance, getPrice } from '/js/app.js';
import { withKoName } from '/js/cardNames.js';
import { pickRandomMoods } from '/js/moodPrompts.js';

renderBottomNav('/index.html');

const moodView = document.getElementById('moodView');
const loadingView = document.getElementById('loadingView');
const resultView = document.getElementById('resultView');
const moodForm = document.getElementById('moodForm');
const chipGrid = document.getElementById('chipGrid');
const coinBadge = document.getElementById('coinBadge');
const readingGate = document.getElementById('readingGate');
const aiLoading = document.getElementById('aiLoading');
const aiContent = document.getElementById('aiContent');

let selectedMood = null;
let session = null;
let member = null;
let balance = 0;
let price = 1;
let cardsCache = null;
let currentCard = null;
let currentMoodText = '';

function renderChips() {
  chipGrid.innerHTML = '';
  const moods = pickRandomMoods(8);
  moods.forEach(m => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.innerHTML = `<span>${m.ic}</span><span>${m.text}</span>`;
    chip.addEventListener('click', () => {
      const wasSelected = chip.classList.contains('selected');
      chipGrid.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      if (!wasSelected) {
        chip.classList.add('selected');
        selectedMood = m.text;
        document.getElementById('moodText').value = m.text;
      } else {
        selectedMood = null;
        document.getElementById('moodText').value = '';
      }
    });
    chipGrid.appendChild(chip);
  });
}
renderChips();

function updateCoinBadge() {
  if (!session) {
    coinBadge.textContent = '로그인';
    coinBadge.setAttribute('href', '/auth.html');
    coinBadge.className = 'badge badge-free';
    return;
  }
  coinBadge.textContent = `🪙 ${balance}`;
  coinBadge.setAttribute('href', '/coins.html');
  coinBadge.className = 'badge badge-active';
}

async function refreshAccount() {
  price = await getPrice('reading');
  session = await getSession();
  if (!session) { updateCoinBadge(); return; }
  member = await getMember(session);
  if (!member) { updateCoinBadge(); return; }
  const claimed = await claimFreeCoins(session);
  balance = claimed ?? await getBalance();
  updateCoinBadge();
  if (member.display_name) {
    document.getElementById('heroTitle').textContent = `${member.display_name}님, 오늘 어떤 마음이신가요?`;
  }
}

async function fetchCards() {
  if (cardsCache) return cardsCache;
  const sb = await getSb();
  const { data, error } = await sb.from('tarot_cards').select('*').eq('card_type', '컬러타로');
  if (error) throw error;
  cardsCache = data;
  return data;
}

function resolveImage(url) {
  if (!url) return '';
  if (url.startsWith('http')) return url;
  return `https://cgxfsktnjsgxcyeqquhr.supabase.co/storage/v1/object/public/tarot-cards/color-tarot/${url}`;
}

function setLoading() {
  aiLoading.innerHTML = '<div class="spinner"></div><p>당신의 마음과 카드의 색을 함께 들여다보고 있어요...</p>';
  aiLoading.style.display = 'block';
}

// The card itself is free to draw and see. Only the reading underneath is
// paid, so this panel turns "nothing to see" into a natural next step.
function renderGate(note) {
  aiLoading.style.display = 'none';
  aiContent.style.display = 'none';
  readingGate.style.display = 'block';

  if (!session) {
    readingGate.innerHTML = `
      <div class="gate-ic">🔒</div>
      <p><strong>이 카드의 풀이는 코인 ${price}개로 열려요</strong></p>
      <p class="muted small mt-8">로그인하면 <b>가입 보너스 5코인</b>을 바로 드려요.<br/>매일 앱에 들어오면 1코인씩 더 드려요.</p>
      <button class="btn btn-primary btn-block mt-16" id="gateLogin">로그인하고 5코인 받기</button>`;
    document.getElementById('gateLogin').addEventListener('click', () => {
      try {
        sessionStorage.setItem('oz_pending_draw', JSON.stringify({ cardId: currentCard.id, mood: currentMoodText }));
      } catch {}
      window.location.href = '/auth.html';
    });
  } else if (balance >= price) {
    readingGate.innerHTML = `
      <div class="gate-ic">🔓</div>
      <p><strong>코인 ${price}개로 오늘의 풀이를 열어볼까요?</strong></p>
      <p class="muted small mt-8">지금 보유 <b>${balance}코인</b> · 풀이는 기록에 자동으로 저장돼요</p>
      ${note ? `<p class="small mt-8" style="color:var(--danger)">${note}</p>` : ''}
      <button class="btn btn-primary btn-block mt-16" id="gateUnlock">풀이 보기 (${price}코인)</button>`;
    document.getElementById('gateUnlock').addEventListener('click', () => loadAiReading(currentCard, currentMoodText));
  } else {
    readingGate.innerHTML = `
      <div class="gate-ic">🪙</div>
      <p><strong>코인이 부족해요</strong></p>
      <p class="muted small mt-8">보유 ${balance}코인 · 풀이에는 ${price}코인이 필요해요<br/>충전하시거나, 내일 출석 보너스 1코인을 받아가세요.</p>
      <a href="/coins.html" class="btn btn-primary btn-block mt-16">코인 충전하기</a>`;
  }
}

async function loadAiReading(card, moodText) {
  readingGate.style.display = 'none';
  aiContent.style.display = 'none';
  setLoading();
  document.getElementById('resultActions').style.opacity = '.5';

  try {
    const res = await fetch('/api/reading', {
      method: 'POST',
      headers: { 'content-type': 'application/json', Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ moodText, card, displayName: member?.display_name || null }),
    });
    const body = await res.json().catch(() => ({}));

    if (res.status === 401) { session = null; updateCoinBadge(); renderGate(); return; }
    if (res.status === 402) {
      if (typeof body.balance === 'number') balance = body.balance;
      updateCoinBadge();
      renderGate();
      return;
    }
    if (res.status === 429) { renderGate(body.error || '요청이 너무 많아요. 잠시 후 다시 시도해주세요.'); return; }
    if (!res.ok) throw new Error('reading failed');

    balance = body.balance;
    updateCoinBadge();
    document.getElementById('readingText').textContent = body.reading || '';
    document.getElementById('aromaName').textContent = body.aroma?.name || '';
    document.getElementById('aromaReason').textContent = body.aroma?.reason || '';
    document.getElementById('teaName').textContent = body.tea?.name || '';
    document.getElementById('teaReason').textContent = body.tea?.reason || '';
    document.getElementById('gemName').textContent = body.gemstone?.name || '';
    document.getElementById('gemReason').textContent = body.gemstone?.reason || '';
    document.getElementById('closingText').textContent = body.closing || '';
    document.getElementById('savedNote').textContent = `기록에 저장했어요 · 남은 코인 ${balance}개`;

    aiLoading.style.display = 'none';
    aiContent.style.display = 'block';
  } catch (err) {
    console.error(err);
    aiLoading.innerHTML = '<p class="muted small">지금은 리딩 메시지를 불러오지 못했어요.<br/><b>코인은 차감되지 않았어요.</b> 잠시 후 다시 시도해주세요.</p><button class="btn btn-outline btn-sm mt-16" id="retryBtn">다시 시도</button>';
    document.getElementById('retryBtn').addEventListener('click', () => loadAiReading(card, moodText));
  } finally {
    document.getElementById('resultActions').style.opacity = '1';
  }
}

function renderResult(card, moodText) {
  document.getElementById('cardImg').src = resolveImage(card.image_url);
  document.getElementById('cardImg').alt = card.name || '';
  document.getElementById('cardName').textContent = card.name ? withKoName(card.name) : '';
  document.getElementById('userMood').textContent = moodText ? `"${moodText}"` : '오늘의 색을 조용히 마주해보세요';

  const studentBox = document.getElementById('studentBox');
  if (member && member.role === 'student' && (card.student_question || card.student_phrase)) {
    studentBox.style.display = 'block';
    document.getElementById('studentQuestion').textContent = card.student_question || '';
    document.getElementById('studentPhrase').textContent = card.student_phrase || '';
  } else {
    studentBox.style.display = 'none';
  }

  moodView.style.display = 'none';
  loadingView.style.display = 'none';
  resultView.style.display = 'block';
  renderGate();
}

moodForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const moodText = document.getElementById('moodText').value.trim() || selectedMood || '';

  moodView.style.display = 'none';
  loadingView.style.display = 'block';

  try {
    const cards = await fetchCards();
    const card = cards[Math.floor(Math.random() * cards.length)];
    currentCard = card;
    currentMoodText = moodText;
    await accountReady;
    setTimeout(() => renderResult(card, moodText), 550);
  } catch (err) {
    console.error(err);
    showToast('카드를 불러오지 못했어요. 잠시 후 다시 시도해주세요.');
    loadingView.style.display = 'none';
    moodView.style.display = 'block';
  }
});

function resetToMoodView() {
  resultView.style.display = 'none';
  readingGate.style.display = 'none';
  aiContent.style.display = 'none';
  moodView.style.display = 'block';
  document.getElementById('moodText').value = '';
  selectedMood = null;
  renderChips();
}

document.getElementById('backBtn').addEventListener('click', (e) => { e.preventDefault(); resetToMoodView(); });
document.getElementById('redrawBtn').addEventListener('click', resetToMoodView);

// Came back from logging in mid-draw: put the same card back on screen.
async function restorePendingDraw() {
  let raw = null;
  try { raw = sessionStorage.getItem('oz_pending_draw'); sessionStorage.removeItem('oz_pending_draw'); } catch {}
  if (!raw) return;
  try {
    const { cardId, mood } = JSON.parse(raw);
    const cards = await fetchCards();
    const card = cards.find((c) => c.id === cardId);
    if (!card) return;
    currentCard = card;
    currentMoodText = mood || '';
    renderResult(card, currentMoodText);
  } catch (err) {
    console.error(err);
  }
}

const accountReady = refreshAccount().then(restorePendingDraw);
</script>
</body>
</html>
